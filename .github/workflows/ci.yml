name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # SocialPoster.MAUI builds for Windows here; on Linux it is an empty placeholder.
      - name: Install MAUI workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows
      - run: dotnet build --configuration Release
        working-directory: src
      - run: dotnet test --configuration Release --no-build
        working-directory: src

  # Mac Catalyst can only be built on macOS.
  maui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0' # must match the SDK pack below
      - run: dotnet workload install maui-maccatalyst
      # The newest Mac Catalyst SDK can require an Xcode the runner image doesn't have yet, so build against the
      # 26.0 SDK pack the workload also installs. Each pack requires its exact Xcode major.minor version.
      # Serialize MSBuild to avoid concurrent native-library rewrites during Mac Catalyst packaging.
      - run: dotnet build SocialPoster.MAUI/SocialPoster.MAUI.csproj --configuration Release -p:MacCatalystSdkVersion=26.0 -m:1
        working-directory: src

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so we can diff against the previous release
      # Only publish when something under src/ changed since the previous v* tag.
      - name: Check for src changes
        id: changes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous release tag found; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" "$GITHUB_SHA" -- src; then
            echo "No changes under src/ since $prev; skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src/ changed since $prev; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Pack
        if: steps.changes.outputs.changed == 'true'
        run: |
          dotnet pack src/SocialPoster.Posting/SocialPoster.Posting.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Core/SocialPoster.Core.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Components/SocialPoster.Components.csproj --configuration Release --output artifacts
      # Exchanges the workflow's OIDC token for a short-lived NuGet API key (Trusted Publishing).
      - name: NuGet login
        id: nuget-login
        if: steps.changes.outputs.changed == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        if: steps.changes.outputs.changed == 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
