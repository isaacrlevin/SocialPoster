name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the workload set: the latest one (11.0.100.1) references an Android manifest (37.2.31) that isn't on NuGet,
  # so an unpinned `dotnet workload install` fails. Bump this once a newer set installs cleanly.
  DOTNET_WORKLOAD_VERSION: 11.0.100

# Runs on the same ref queue up, so two quick pushes to main can't both release the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On main, a version with no v<version> tag yet means "release it": publish and release run, and release creates the tag.
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          versions=$(grep -hoP '(?<=<Version>)[^<]+' src/SocialPoster.{Posting,Core,Components}/*.csproj)
          app=$(grep -hoP '(?<=<ApplicationDisplayVersion>)[^<]+' src/SocialPoster.MAUI/SocialPoster.MAUI.csproj)
          unique=$(printf '%s\n' $versions "$app" | sort -u)
          if [ "$(printf '%s\n' "$unique" | wc -l)" -ne 1 ]; then
            echo "::error::The library <Version>s and the MAUI <ApplicationDisplayVersion> must match. Found: $(echo $versions) (libraries), $app (app)."
            exit 1
          fi
          tag="v$unique"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag doesn't exist yet; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      # SocialPoster.MAUI builds for Windows here; on Linux it is an empty placeholder.
      - name: Install MAUI workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows --version ${{ env.DOTNET_WORKLOAD_VERSION }}
      - run: dotnet build --configuration Release
        working-directory: src
      - run: dotnet test --configuration Release --no-build
        working-directory: src

  # Desktop app for Windows: a self-contained, unpackaged build with an Inno Setup installer per architecture, for
  # GitHub Releases. The installer is unsigned, so SmartScreen offers "Run anyway"; an unsigned MSIX can't be
  # installed at all, which is why the MSIX (below) is only for the Store, which signs it.
  # The desktop jobs build on every run (to catch packaging breaks) but only upload artifacts when releasing, since
  # they're large and count against Actions storage. `version` is skipped on PRs, hence the !failure() condition.
  desktop-windows:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { rid: win-x64, arch: x64 }
          - { rid: win-arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet workload install maui-windows --version ${{ env.DOTNET_WORKLOAD_VERSION }}
      - name: Publish
        run: >-
          dotnet publish SocialPoster.MAUI/SocialPoster.MAUI.csproj --configuration Release
          --framework net11.0-windows10.0.19041.0 --runtime ${{ matrix.rid }} --self-contained true
          -p:WindowsAppSDKSelfContained=true --output ../artifacts/SocialPoster
        working-directory: src
      - name: Package
        shell: pwsh
        run: |
          # Core and Components copy the Copilot CLI for the build machine (x64); the arm64 app has its own copy.
          if ('${{ matrix.rid }}' -ne 'win-x64') {
            Remove-Item -Recurse -Force artifacts/SocialPoster/runtimes/win-x64 -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path artifacts/SocialPoster/SocialPoster.MAUI.exe)) { throw 'SocialPoster.MAUI.exe not found in the publish output.' }

          # Installer (Inno Setup). The version comes from the csproj so it matches the release tag.
          choco install innosetup --no-progress -y
          $version = ([xml](Get-Content src/SocialPoster.MAUI/SocialPoster.MAUI.csproj)).Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ } | Select-Object -First 1
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\artifacts\SocialPoster" "/DOutputDir=$PWD\artifacts" installers/windows/SocialPoster.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.release == 'true'
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: artifacts/*-setup.exe
          retention-days: 1

  # Microsoft Store packages (unsigned MSIX per architecture; the Store signs them on submission). Upload the
  # artifacts to Partner Center by hand. Until the Store* identity in SocialPoster.MAUI.csproj is filled in, this
  # builds with a placeholder identity to check that packaging still works, and uploads nothing.
  desktop-windows-store:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { rid: win-x64, arch: x64 }
          - { rid: win-arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet workload install maui-windows --version ${{ env.DOTNET_WORKLOAD_VERSION }}
      - name: Check Store identity
        id: identity
        shell: pwsh
        run: |
          if (Select-String -Path src/SocialPoster.MAUI/SocialPoster.MAUI.csproj -Pattern '<Store(IdentityName|Publisher)[^>]*>[^<]*TODO' -Quiet) {
            echo "::warning::The Store identity in SocialPoster.MAUI.csproj isn't set yet; building with a placeholder and skipping the upload."
            "args=-p:StoreIdentityName=Placeholder.SocialPoster -p:StorePublisher=CN=00000000-0000-0000-0000-000000000000" >> $env:GITHUB_OUTPUT
            "configured=false" >> $env:GITHUB_OUTPUT
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }
      - name: Publish MSIX
        run: >-
          dotnet publish SocialPoster.MAUI/SocialPoster.MAUI.csproj --configuration Release
          --framework net11.0-windows10.0.19041.0 --runtime ${{ matrix.rid }} --self-contained true
          -p:WindowsPackageType=MSIX -p:AppxPackageDir=../../artifacts/msix/
          ${{ steps.identity.outputs.args }}
        working-directory: src
      - name: Collect package
        shell: pwsh
        run: |
          $msix = Get-ChildItem artifacts/msix -Recurse -Filter "SocialPoster*_${{ matrix.arch }}.msix" | Select-Object -First 1
          if (-not $msix) { throw 'No MSIX package found in artifacts/msix.' }
          New-Item -ItemType Directory -Force artifacts/store | Out-Null
          Copy-Item $msix.FullName artifacts/store/
          Get-ChildItem artifacts/store

      - uses: actions/upload-artifact@v4
        if: steps.identity.outputs.configured == 'true' && needs.version.outputs.release == 'true'
        with:
          name: store-windows-${{ matrix.arch }}
          path: artifacts/store/*.msix
          retention-days: 14

  # Desktop app for macOS (Mac Catalyst, Intel and Apple silicon). Can only be built on macOS.
  desktop-macos:
    needs: version
    if: ${{ !cancelled() && !failure() }}
    # The .NET 11 Mac Catalyst pack needs Xcode 27.2, which only the (preview) xcode-27 image has; macos-26/latest
    # top out at Xcode 26.6. Switch back to macos-latest once it ships Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2' # must match the workload's Mac Catalyst SDK pack
      - run: dotnet workload install maui-maccatalyst --version ${{ env.DOTNET_WORKLOAD_VERSION }}
      # The .NET 11 workload ships only the Mac Catalyst 27.2 SDK pack (no older 26.0 pack), so build against the
      # default TFM. Each pack requires its exact Xcode major.minor version.
      # Serialize MSBuild to avoid concurrent native-library rewrites during Mac Catalyst packaging.
      # The app is ad-hoc signed (CodesignKey=-): there's no Developer ID certificate, so it isn't notarized.
      # The runner image sets MD_APPLE_SDK_ROOT, which the SDK no longer reads (it warns); setup-xcode already
      # selected the Xcode to use. CopilotSkipCliDownload is also set in the csproj; passing it globally makes sure
      # no referenced project bundles the Copilot CLI into the app.
      - name: Publish
        run: |
          unset MD_APPLE_SDK_ROOT
          dotnet publish SocialPoster.MAUI/SocialPoster.MAUI.csproj --configuration Release \
            --framework net11.0-maccatalyst -m:1 \
            -p:CreatePackage=false -p:EnableCodeSigning=true -p:CodesignKey=- -p:CopilotSkipCliDownload=true
        working-directory: src
      # The build leaves a thin .app per RID (maccatalyst-x64, maccatalyst-arm64) and a universal one; ship the
      # universal one. Its location under bin/Release has moved between SDKs, so pick it by architecture, not path.
      - name: Collect app
        run: |
          app=""
          while IFS= read -r candidate; do
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$candidate/Contents/Info.plist" 2>/dev/null) || continue
            archs=$(lipo -archs "$candidate/Contents/MacOS/$exe" 2>/dev/null || echo unknown)
            echo "$candidate: $archs"
            case " $archs " in *" x86_64 "*) case " $archs " in *" arm64 "*) app="$candidate" ;; esac ;; esac
          done < <(find src/SocialPoster.MAUI/bin/Release -maxdepth 3 -name 'SocialPoster.app' -type d -not -path '*/runtimes/*')
          if [ -z "$app" ]; then echo "::error::No universal (x86_64 + arm64) SocialPoster.app found."; exit 1; fi
          nested=$(find "$app" -mindepth 2 -name '*.app' -type d)
          if [ -n "$nested" ]; then
            echo "::error::$app contains nested .app bundles (is the Copilot CLI being bundled?):"
            echo "$nested"
            exit 1
          fi
          echo "Packaging $app"
          codesign --verify --deep --strict "$app"
          mkdir -p artifacts
          ditto "$app" artifacts/SocialPoster.app
      # Disk image with an Applications shortcut for drag-to-install. Mac Catalyst apps bundle the .NET runtime.
      - name: Create DMG
        run: |
          mkdir -p dmg
          ditto artifacts/SocialPoster.app dmg/SocialPoster.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname SocialPoster -srcfolder dmg -ov -format UDZO artifacts/SocialPoster-macos.dmg

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.release == 'true'
        with:
          name: desktop-macos
          path: artifacts/SocialPoster-macos.dmg
          retention-days: 1

  # Creates the tag and GitHub release (with generated notes) on this commit and attaches the desktop apps. Runs after
  # publish, so a failed NuGet push leaves no tag and the next run on main tries the release again.
  release:
    needs: [version, publish, desktop-windows, desktop-macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to delete this run's desktop artifacts once they're on the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$TAG" dist/*-setup.exe dist/*.dmg --clobber
      # The files now live on the release (which doesn't count against Actions storage), so drop the artifact copies.
      - name: Delete desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("desktop-")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"; done

  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Pack
        run: |
          dotnet pack src/SocialPoster.Posting/SocialPoster.Posting.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Core/SocialPoster.Core.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Components/SocialPoster.Components.csproj --configuration Release --output artifacts
      # Exchanges the workflow's OIDC token for a short-lived NuGet API key (Trusted Publishing).
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
