name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
        working-directory: src
      - run: dotnet test --configuration Release --no-build
        working-directory: src

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: |
          dotnet pack src/SocialPoster.Posting/SocialPoster.Posting.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Core/SocialPoster.Core.csproj --configuration Release --output artifacts
          dotnet pack src/SocialPoster.Components/SocialPoster.Components.csproj --configuration Release --output artifacts
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
